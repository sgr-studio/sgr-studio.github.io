<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/init.css">
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>404 - Page Not Found | SGR STUDIO</title>
    <style>
        /* 404 Specific Page Styling */
        .hero-title-area {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            margin-bottom: 20px;
        }

        #three-404-title-canvas {
            width: 100%;
            height: 100%;
            max-width: 500px;
            display: block;
        }

        /* TV & Character Scene */
        .room-scene-section {
            width: 100%;
            margin-top: 80px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(ellipse at bottom, rgba(143, 200, 48, 0.12) 0%, transparent 75%);
            position: relative;
        }

        .watch-group {
            display: flex;
            align-items: flex-end;
            gap: 60px;
        }

        .char-back-wrapper {
            width: 180px;
            position: relative;
            z-index: 2;
        }

        .char-back-img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4)) brightness(0.8);
            animation: characterFloat 4s infinite ease-in-out;
        }

        @keyframes characterFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .tv-wrapper {
            width: 230px;
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3;
        }

        .tv-wrapper:hover {
            transform: scale(1.1) rotate(2deg);
        }

        .tv-glow {
            position: absolute;
            top: 30%;
            left: 20%;
            width: 55%;
            height: 45%;
            background: var(--accent);
            filter: blur(40px);
            opacity: 0.15;
            animation: tvFlicker 3s infinite alternate;
            pointer-events: none;
        }

        @keyframes tvFlicker {
            0% { opacity: 0.1; }
            100% { opacity: 0.25; }
        }

        /* Overlay & Game Terminal */
        #game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #game-overlay.active {
            display: flex;
            opacity: 1;
        }

        .terminal-window {
            width: 90%;
            max-width: 650px;
            background: #0d0d0d;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 50px 120px rgba(0,0,0,0.9);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #game-overlay.active .terminal-window {
            transform: scale(1);
        }

        .terminal-header {
            background: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .terminal-body {
            padding: 30px;
            font-family: 'Courier New', monospace;
            color: #8fc830;
            min-height: 380px;
        }

        #game-canvas {
            display: none;
            background: #000;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(143, 200, 48, 0.2);
        }

        .game-stats {
            display: none;
            justify-content: space-between;
            margin-top: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .hero-title-area { height: 180px; justify-content: center; }
            .watch-group { gap: 30px; transform: scale(0.85); }
        }
    </style>
</head>

                    <ul>

                        <li data-i18n="nav.contact" data-desc="Get in touch" onclick="location.href='contact.html'">CONTACT</li>

                                <linearGradient id="tvCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">

                            <line x1="70" y1="10" x2="55" y2="25" stroke="#666" stroke-width="2"/>
                            <rect x="10" y="20" width="80" height="60" rx="8" fill="url(#tvCaseGrad)"/>
                            <rect x="15" y="25" width="55" height="50" rx="5" fill="#1a1a1a"/>
                            <rect x="18" y="28" width="49" height="44" rx="3" fill="#000"/>
                            <rect x="73" y="25" width="12" height="50" rx="2" fill="#2a1a0a"/>
                            <circle cx="79" cy="35" r="3" fill="#111"/>
                            <circle cx="79" cy="45" r="3" fill="#111"/>

    <!-- Game Overlay UI -->
    <div id="game-overlay">
        <div class="terminal-window">
            <div class="terminal-header">
                <div style="display:flex; gap:8px;">
                    <div style="width:12px; height:12px; border-radius:50%; background:#ff5f56;"></div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/background.js"></script>
    <script src="js/move.js"></script>

    <!-- 404 Specific Interactive Script -->
    <script>
    (function() {
        let s404, c404, r404, m404;
        let frame = 0;

        // Use correct JSDelivr paths for npm packages to ensure correct MIME types (application/javascript)
        const FONT_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json';
        const ADDONS = [
            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js',
            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js'
        ];

        async function init() {
            try {
                if (typeof THREE === 'undefined') throw new Error("THREE.js not loaded");

                // Sequential loading of required addons
                for (const url of ADDONS) {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = url;
                        script.crossOrigin = "anonymous";
                        script.onload = () => {
                            console.log("Successfully loaded:", url);
                            resolve();
                        };
                        script.onerror = () => reject(new Error("Failed to load: " + url));
                        document.head.appendChild(script);
                    });
                }

                setupScene();
            } catch (e) {
                console.error("3D Init Error:", e);
                showFallback();
            }
        }

        function setupScene() {
            const container = document.getElementById('hero-3d-title-container');
            if (!container) return;

            s404 = new THREE.Scene();
            
            c404 = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            c404.position.set(0, 0, 15);

            r404 = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            r404.setPixelRatio(window.devicePixelRatio);
            r404.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(r404.domElement);

            // In r128, these addons attach themselves to the THREE namespace or global window
            const FontLoader = THREE.FontLoader || window.FontLoader;
            const TextGeometry = THREE.TextGeometry || window.TextGeometry;

            if (!FontLoader || !TextGeometry) {
                throw new Error("Required THREE addons (FontLoader/TextGeometry) not found.");
            }

            const loader = new FontLoader();
            loader.load(FONT_URL, (font) => {
                const geometry = new TextGeometry('404', {
                    font: font,
                    size: 5,
                    height: 2,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 0.3,
                    bevelSize: 0.2,
                    bevelOffset: 0,
                    bevelSegments: 5
                });
                geometry.center();

                const material = new THREE.MeshPhongMaterial({ 
                    color: 0x8fc830,
                    specular: 0xffffff,
                    shininess: 100
                });
                
                m404 = new THREE.Mesh(geometry, material);
                s404.add(m404);

                const light1 = new THREE.DirectionalLight(0xffffff, 1);
                light1.position.set(5, 5, 10);
                s404.add(light1);

                const light2 = new THREE.PointLight(0x8fc830, 1.2);
                light2.position.set(-5, -5, 5);
                s404.add(light2);

                s404.add(new THREE.AmbientLight(0xffffff, 0.6));

                animate();
                
                const l = document.getElementById('loader');
                if(l) l.classList.add('loaded');
            }, undefined, (err) => {
                console.error("Font Load Error:", err);
                showFallback();
            });

            window.addEventListener('resize', () => {
                c404.aspect = container.clientWidth / container.clientHeight;
                c404.updateProjectionMatrix();
                r404.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            frame += 0.02;
            if (m404) {
                m404.rotation.y += 0.035; // Distinct rotation
                m404.position.y = Math.sin(frame) * 0.4; // Gentle float
            }
            r404.render(s404, c404);
        }

        function showFallback() {
            const container = document.getElementById('hero-3d-title-container');
            if (container) {
                container.innerHTML = '<h1 style="font-size: 8rem; color: #8fc830; margin: 0; line-height: 1;">404</h1>';
            }
            const l = document.getElementById('loader');
            if(l) l.classList.add('loaded');
        }

        init();

        // --- Game System ---
        const overlay = document.getElementById('game-overlay');
        const logText = document.getElementById('boot-log-text');
        const gameWrap = document.getElementById('game-inner-wrap');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let active = false, sc = 0, li = 3, objs = [], p = { x: 175, y: 370, w: 50, h: 10 };

        window.launchGame = function() {
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
            logText.innerHTML = "> ANALYZING SIGNAL...<br>> ESTABLISHING SECURE LINK...";
            const steps = ["> CALIBRATING FREQUENCY...", "> LOADING DATA BLOCKS...", "> SYSTEM READY."];
            let i = 0;
            const t = setInterval(() => {
                if(i < steps.length) logText.innerHTML += "<br>> " + steps[i++];
                else {
                    clearInterval(t);
                    setTimeout(() => {
                        logText.style.display = 'none';
                        gameWrap.style.display = 'block';
                        canvas.style.display = 'block';
                        startGame();
                    }, 800);
                }
            }, 600);
        };

        window.closeGame = function() {
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                active = false;
                logText.style.display = 'block';
                gameWrap.style.display = 'none';
            }, 500);
        };

        function startGame() {
            active = true; sc = 0; li = 3; objs = [];
            document.getElementById('score-count').innerText = sc;
            document.getElementById('life-count').innerText = li;
            const handler = (e) => {
                const r = canvas.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                p.x = (x - r.left) * (canvas.width / r.width) - p.w/2;
                p.x = Math.max(0, Math.min(canvas.width - p.w, p.x));
            };
            window.addEventListener('mousemove', handler);
            window.addEventListener('touchmove', handler, {passive:false});
            runLoop();
        }

        function runLoop() {
            if(!active) return;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#8fc830';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            if(Math.random() < 0.04) objs.push({ x: Math.random()*380, y: -20, v: 4+Math.random()*3, t: Math.random()<0.15?'X':'1' });
            for(let i=objs.length-1; i>=0; i--) {
                const o = objs[i]; o.y += o.v;
                ctx.fillStyle = o.t === '1' ? '#0f0' : '#f44';
                ctx.font = 'bold 20px monospace';
                ctx.fillText(o.t, o.x, o.y);
                if(o.y > p.y && o.y < p.y+15 && o.x > p.x-10 && o.x < p.x+p.w) {
                    if(o.t === '1') sc += 10; else li--;
                    document.getElementById('score-count').innerText = sc;
                    document.getElementById('life-count').innerText = li;
                    objs.splice(i,1);
                    if(li <= 0) { active = false; alert('SYSTEM ERROR: RECOVERY FAILED\nSCORE: ' + sc); closeGame(); }
                } else if(o.y > 400) objs.splice(i,1);
            }
            requestAnimationFrame(runLoop);
        }
    })();
    </script>
</body>
