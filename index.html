<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/init.css">
    <title>SGR STUDIO</title>
</head>
<body>
    <div class="background"></div>
    <header>
        <div class="container">
            <section class="header-container">
                <div class="logo-container">
                    <div class="logo"></div>
                    <span>STUDIO</span>
                </div>
                
                <div class="header-navigation">
                    <ul>
                        <li>HOME</li>
                        <li>ABOUT</li>
                        <li>BLOG</li>
                        <li>WORKS</li>
                        <li>CONTACT</li>
                    </ul>
                </div>
            </section>
        </div>
    </header>
    <main>
        <div class="container">
            <section class="hero">
                <div class="hero-content">
                    <h1 class="hero-title">理屈より、創作欲を。</h1>
                    <p class="hero-description">私たちは小さな独立系スタジオです。</p>
                    <div class="hero-cta">
                        <button class="btn-primary">View Works</button>
                    </div>
                </div>
                <div class="hero-image-container">
                    <div class="hero-image-blob"></div>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">

        </div>
    </footer>
    <script src="js/background.js"></script>
</body>
</html>
