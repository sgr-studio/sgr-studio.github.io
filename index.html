<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/init.css">
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>SGR STUDIO</title>
</head>
<body>
    <div id="loader" class="loader">
        <div class="loader-content">
            <p id="loader-copy" class="loader-copy"></p>
            <p id="loader-subtitle" class="loader-subtitle"></p>
            <div class="loader-line"></div>
        </div>
    </div>
    <div id="canvas-container" class="background"></div>
    <header>
        <div class="container">
            <section class="header-container">
                <div class="logo-container" onclick="location.href='index.html'">
                    <div class="logo"></div>
                    <span>STUDIO</span>
                </div>
                
                <div class="header-navigation">
                    <div class="menu-bg-svg-container">
                        <svg id="menu-bg-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                            <path id="menu-blob-path" d=""></path>
                        </svg>
                    </div>
                    <ul>
                        <li data-i18n="nav.home" data-desc="Top Page" onclick="location.href='index.html'">HOME</li>
                        <li data-i18n="nav.about" data-desc="Who we are" onclick="location.href='about.html'">ABOUT</li>
                        <li data-i18n="nav.blog" data-desc="Our stories" onclick="location.href='blog.html'">BLOG</li>
                        <li data-i18n="nav.works" data-desc="Our creations" onclick="location.href='works.html'">WORKS</li>
                        <li data-i18n="nav.contact" data-desc="Get in touch" onclick="location.href='contact.html'">CONTACT</li>
                    </ul>
                    <div class="lang-dropdown">
                        <div class="lang-current">
                            <i class='bx bx-globe'></i>
                            <span id="current-lang-label">JP</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>
                        <div class="lang-options">
                            <div onclick="setLanguage('ja')">日本語</div>
                            <div onclick="setLanguage('en')">English</div>
                            <div onclick="setLanguage('zh')">简体中文</div>
                            <div onclick="setLanguage('ko')">한국어</div>
                        </div>
                    </div>
                </div>
                
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </section>
        </div>
    </header>
    <main>
        <div class="container">
            <section class="hero">
                <div class="hero-content">
                    <h1 class="hero-title" data-i18n="hero.title">理屈より、創作欲を。</h1>
                    <p class="hero-description" data-i18n="hero.description">様々なアプリを開発しています。</p>
                    <div class="hero-cta">
                        <button class="btn-primary" data-i18n="hero.cta" onclick="move('https://sgr-studio.github.io/works.html')">View Works</button>
                    </div>
                </div>
                <div class="hero-image-container">
                    <div class="hero-image-blob"></div>
                </div>
            </section>
        </div>
        <div class="container introduce">
            <div class="intro-profile">
                <h2 class="section-title" data-i18n="intro.title">Who we are</h2>
                <p class="section-desc" data-i18n="intro.description">理屈よりも直感を大切に、新しい体験を創造するスタジオです。</p>
            </div>

            <div class="pickup-section">
                <h3 class="sub-title" data-i18n="intro.pickup_title">PickUP Creations</h3>
                <div class="pickup-grid">
                    <div class="pickup-card">
                        <div class="card-image" style="background: linear-gradient(135deg, #8fc830 0%, #22c55e 100%);">
                            <img src="https://raw.githubusercontent.com/SuchGameR/sycs-Vue/refs/heads/About/Logo.svg" alt="SYCS" class="logo-sycs">
                            <!-- 急遽入れました : 修正はしないかも... -->
                            <style>
                                .logo-sycs {
                                    width: 60px;
                                }
                            </style>
                        </div>
                        <div class="card-content">
                            <div class="tag-list">
                                <span class="tag">Featured</span>
                                <span class="tag-dev">Development</span>
                                <span class="tag-dev">Co-op</span>
                            </div>
                            <h3 data-i18n="apps.app1_name"></h3>
                            <p data-i18n="apps.app1_desc"></p>
                            <button class="btn-primary" style="padding: 10px 25px; font-size: 14px;" data-i18n="hero.cta" onclick="move('https://github.com/SuchGameR/sycs-Vue/tree/About')">View Works</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="recommend-section">
                <h3 class="sub-title" data-i18n="intro.recommend_title"></h3>
                <div class="apps-grid">
                    <div class="app-item recommend">
                        <span class="recommend-tag">Recommended</span>
                        <div class="app-icon"><i class='bx bx-code-alt'></i></div>
                        <div class="app-info">
                            <h4 data-i18n="apps.app2_name"></h4>
                            <p data-i18n="apps.app2_desc"></p>
                        </div>
                    </div>
                    <div class="app-item recommend">
                        <span class="recommend-tag">Recommended</span>
                        <div class="app-icon"><i class='bx bx-sync'></i></div>
                        <div class="app-info">
                            <h4 data-i18n="apps.app3_name"></h4>
                            <p data-i18n="apps.app3_desc"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="all-apps-section">
                <h3 class="sub-title" data-i18n="intro.apps_title"></h3>
                <div class="apps-grid">
                    <div class="app-item">
                        <div class="app-icon"><i class='bx bx-palette'></i></div>
                        <div class="app-info">
                            <h4 data-i18n="apps.app4_name"></h4>
                            <p data-i18n="apps.app4_desc"></p>
                        </div>
                    </div>
                    <div class="app-item">
                        <div class="app-icon"><i class='bx bx-task'></i></div>
                        <div class="app-info">
                            <h4 data-i18n="apps.app5_name"></h4>
                            <p data-i18n="apps.app5_desc"></p>
                        </div>
                    </div>
                    <div class="app-item">
                        <div class="app-icon"><i class='bx bx-cloud'></i></div>
                        <div class="app-info">
                            <h4 data-i18n="apps.app6_name"></h4>
                            <p data-i18n="apps.app6_desc"></p>
                        </div>
                    </div>
                    <div class="app-item">
                        <div class="app-icon"><i class='bx bx-terminal'></i></div>
                        <div class="app-info">
                            <h4 data-i18n="apps.app7_name"></h4>
                            <p data-i18n="apps.app7_desc"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="logo-container">
                        <div class="logo"></div>
                        <span>SGR STUDIO</span>
                    </div>
                    <p class="copyright">&copy; 2026 SGR STUDIO. All rights reserved.</p>
                </div>
                
                <div class="footer-right">
                    <div class="social-links">
                        <a href="https://www.youtube.com/@SGR-STUDIO-OFFICIAL" target="_blank" rel="noopener noreferrer"><i class='bx bxl-youtube'></i></a>
                        <a href="https://github.com/sgr-studio/" target="_blank" rel="noopener noreferrer"><i class='bx bxl-github'></i></a>
                    </div>
                    
                    <div class="theme-dropdown">
                        <div class="theme-current" onclick="toggleTheme()">
                            <i id="theme-icon-active" class='bx bx-sun'></i>
                            <span id="current-theme-label">Light</span>
                            <i class='bx bx-chevron-down' id="theme-chevron"></i>
                        </div>
                        <div class="theme-options">
                            <div onclick="setTheme('light')"><i class='bx bx-sun'></i> Light</div>
                            <div onclick="setTheme('dark')"><i class='bx bx-moon'></i> Dark</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/background.js"></script>
    <script src="js/move.js"></script>
</body>
</html>
